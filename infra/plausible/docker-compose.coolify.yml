# Plausible CE, adapted from the official Coolify template.
# Coolify creates secrets and expands bind mount content. Do not run this file directly.
# port: 8000
services:
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      - SERVICE_URL_PLAUSIBLE
      - BASE_URL=${SERVICE_URL_PLAUSIBLE}
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_PLAUSIBLE}
      - TOTP_VAULT_KEY=${SERVICE_REALBASE64_32_TOTP}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@plausible-db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible-events-db:8123/plausible_events_db
      - DISABLE_REGISTRATION=true
      - MAILER_ADAPTER=Bamboo.LocalAdapter
      - HTTP_PORT=8000
      - TMPDIR=/var/lib/plausible/tmp
      - ERL_FLAGS=+S 2:2
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - http://127.0.0.1:8000/api/health
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    volumes:
      - plausible-data:/var/lib/plausible
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
  plausible-db:
    image: postgres:16-alpine
    volumes:
      - plausible-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=plausible
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
  plausible-events-db:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    volumes:
      - plausible-events-data:/var/lib/clickhouse
      - type: bind
        source: ./clickhouse/clickhouse-config.xml
        target: /etc/clickhouse-server/config.d/logs.xml
        read_only: true
        content: <clickhouse><logger><level>warning</level><console>true</console></logger><query_log remove="remove"/><query_thread_log remove="remove"/><text_log remove="remove"/><trace_log remove="remove"/><metric_log remove="remove"/><asynchronous_metric_log remove="remove"/><session_log remove="remove"/><part_log remove="remove"/></clickhouse>
      - type: bind
        source: ./clickhouse/clickhouse-ipv4-only.xml
        target: /etc/clickhouse-server/config.d/ipv4-only.xml
        read_only: true
        content: <clickhouse><listen_host>0.0.0.0</listen_host></clickhouse>
      - type: bind
        source: ./clickhouse/clickhouse-low-resources.xml
        target: /etc/clickhouse-server/config.d/low-resources.xml
        read_only: true
        content: <clickhouse><mark_cache_size>134217728</mark_cache_size></clickhouse>
      - type: bind
        source: ./clickhouse/clickhouse-user-config.xml
        target: /etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml
        read_only: true
        content: <clickhouse><profiles><default><max_threads>1</max_threads><max_block_size>8192</max_block_size><max_download_threads>1</max_download_threads><input_format_parallel_parsing>0</input_format_parallel_parsing><output_format_parallel_formatting>0</output_format_parallel_formatting></default></profiles></clickhouse>
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
volumes:
  plausible-data: null
  plausible-postgres-data: null
  plausible-events-data: null
