# Coolify Service Stack: SERVICE_* values are generated by Coolify.
services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1@sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
    init: true
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - SERVICE_URL_UMAMI_3000
      - DATABASE_URL=postgres://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/$POSTGRES_DB
      - APP_SECRET=$SERVICE_PASSWORD_64_UMAMI
      - TWO_FACTOR_ENCRYPTION_KEY=$SERVICE_HEX_64_UMAMITOTP
      - DISABLE_TELEMETRY=1
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:3000/api/heartbeat]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 60s
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=${POSTGRES_DB:-umami}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 20s
      retries: 10
volumes:
  postgresql-data:
